# AxiorHub Pilote : index vectoriel Qdrant, facultatif (licence Apache-2.0, https://github.com/qdrant/qdrant).
# Démarrage sur le serveur : docker compose -f docker-compose.qdrant.yml up -d
# Puis, dans Paramètres › Connexions, section Intelligence artificielle : Index vectoriel Qdrant = http://127.0.0.1:6333
#
# Le service n'écoute que sur la machine locale. Il ne reçoit que des vecteurs et des identifiants : jamais le texte ni le nom des pièces.
# AxiorHub fonctionne sans lui : s'il est arrêté ou indisponible, la recherche intégrée prend le relais automatiquement.
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
