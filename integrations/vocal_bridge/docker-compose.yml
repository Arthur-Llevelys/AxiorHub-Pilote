services:
  axiorhub-vocal-bridge:
    build: .
    image: axiorhub/vocal-bridge:3.0.0
    container_name: axiorhub-vocal-bridge
    restart: unless-stopped
    init: true
    user: "${VOCAL_WORKER_UID:?Specify non-root UID}:${VOCAL_WORKER_GID:?Specify non-root GID}"
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    ports:
      - "127.0.0.1:9011:9011"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VOCAL_BASE_URL: "http://host.docker.internal:7860"
      BRIDGE_TOKEN_FILE: "/run/secrets/bridge-token"
      MAX_AUDIO_BYTES: "536870912"
      VOCAL_CPU_CONFIRMED: "${VOCAL_CPU_CONFIRMED:?Confirm actual Vocal CPU configuration}"
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - ./bridge-token:/run/secrets/bridge-token:ro
      - ${VOCAL_CACHE_DIR:?Specify actual mounted Vocal cache}:/vocal-cache
      - ${VOCAL_OUTPUT_DIR:?Specify actual mounted Vocal outputs}:/vocal-output
    networks:
      - axiorhub-audio
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  axiorhub-audio:
    external: true
