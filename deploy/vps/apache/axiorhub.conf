# AxiorHub — hôte virtuel Apache (modèle : __DOMAIN__ est remplacé par install-vps.sh).
# certbot --apache crée ensuite la version HTTPS (axiorhub-le-ssl.conf) et la redirection depuis HTTP.
<VirtualHost *:80>
    ServerName __DOMAIN__
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /.well-known/acme-challenge !
    # Flux d'activité (SSE) : jamais compressé ni retenu
    SetEnvIf Request_URI "^/live/events" no-gzip=1
    # flushpackets : l'activité en direct (flux d'événements) n'est pas retenue par Apache
    ProxyPass / http://127.0.0.1:__PORT__/ timeout=600 flushpackets=on
    ProxyPassReverse / http://127.0.0.1:__PORT__/
    RequestHeader set X-Forwarded-Proto "https"
    # 5.6.39 : moteur arrêté ou en cours de redémarrage : page qui se recharge seule
    ErrorDocument 502 "<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta http-equiv='refresh' content='5'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AxiorHub red&eacute;marre</title></head><body style='margin:0;background:#f4f7fb;font-family:system-ui,Segoe UI,sans-serif;color:#172033'><main style='max-width:460px;margin:12vh auto;padding:32px 28px;background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(15,23,42,.12);text-align:center'><div style='width:56px;height:56px;margin:0 auto 16px;border-radius:16px;background:#2563eb;color:#fff;font:700 30px/56px system-ui'>A</div><h1 style='font-size:1.3rem;margin:0 0 10px'>AxiorHub red&eacute;marre</h1><p style='color:#475569;line-height:1.5'>Le service termine son d&eacute;marrage (mise &agrave; jour ou red&eacute;marrage du serveur). Cette page se recharge toute seule dans quelques secondes ; rien n&rsquo;a &eacute;t&eacute; perdu.</p><p style='margin-top:22px'><a href='' style='display:inline-block;padding:10px 18px;border-radius:12px;background:#2563eb;color:#fff;text-decoration:none;font-weight:600'>&#8635; Recharger la page</a> <a href='/agent-courriel/' style='display:inline-block;padding:10px 18px;border-radius:12px;border:1px solid #cbd5e1;color:#1e3a8a;text-decoration:none;font-weight:600'>&#8962; Accueil</a></p></main></body></html>"
    ErrorDocument 503 "<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta http-equiv='refresh' content='5'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AxiorHub red&eacute;marre</title></head><body style='margin:0;background:#f4f7fb;font-family:system-ui,Segoe UI,sans-serif;color:#172033'><main style='max-width:460px;margin:12vh auto;padding:32px 28px;background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(15,23,42,.12);text-align:center'><div style='width:56px;height:56px;margin:0 auto 16px;border-radius:16px;background:#2563eb;color:#fff;font:700 30px/56px system-ui'>A</div><h1 style='font-size:1.3rem;margin:0 0 10px'>AxiorHub red&eacute;marre</h1><p style='color:#475569;line-height:1.5'>Le service termine son d&eacute;marrage (mise &agrave; jour ou red&eacute;marrage du serveur). Cette page se recharge toute seule dans quelques secondes ; rien n&rsquo;a &eacute;t&eacute; perdu.</p><p style='margin-top:22px'><a href='' style='display:inline-block;padding:10px 18px;border-radius:12px;background:#2563eb;color:#fff;text-decoration:none;font-weight:600'>&#8635; Recharger la page</a> <a href='/agent-courriel/' style='display:inline-block;padding:10px 18px;border-radius:12px;border:1px solid #cbd5e1;color:#1e3a8a;text-decoration:none;font-weight:600'>&#8962; Accueil</a></p></main></body></html>"
    ErrorDocument 504 "<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta http-equiv='refresh' content='5'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AxiorHub red&eacute;marre</title></head><body style='margin:0;background:#f4f7fb;font-family:system-ui,Segoe UI,sans-serif;color:#172033'><main style='max-width:460px;margin:12vh auto;padding:32px 28px;background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(15,23,42,.12);text-align:center'><div style='width:56px;height:56px;margin:0 auto 16px;border-radius:16px;background:#2563eb;color:#fff;font:700 30px/56px system-ui'>A</div><h1 style='font-size:1.3rem;margin:0 0 10px'>AxiorHub red&eacute;marre</h1><p style='color:#475569;line-height:1.5'>Le service termine son d&eacute;marrage (mise &agrave; jour ou red&eacute;marrage du serveur). Cette page se recharge toute seule dans quelques secondes ; rien n&rsquo;a &eacute;t&eacute; perdu.</p><p style='margin-top:22px'><a href='' style='display:inline-block;padding:10px 18px;border-radius:12px;background:#2563eb;color:#fff;text-decoration:none;font-weight:600'>&#8635; Recharger la page</a> <a href='/agent-courriel/' style='display:inline-block;padding:10px 18px;border-radius:12px;border:1px solid #cbd5e1;color:#1e3a8a;text-decoration:none;font-weight:600'>&#8962; Accueil</a></p></main></body></html>"
    LimitRequestBody 31457280
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"
    ErrorLog ${APACHE_LOG_DIR}/axiorhub-error.log
    CustomLog ${APACHE_LOG_DIR}/axiorhub-access.log combined
</VirtualHost>
