# AxiorHub — hôte virtuel Apache (modèle : __DOMAIN__ est remplacé par install-vps.sh).
# certbot --apache crée ensuite la version HTTPS (axiorhub-le-ssl.conf) et la redirection depuis HTTP.
<VirtualHost *:80>
    ServerName __DOMAIN__
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /.well-known/acme-challenge !
    # flushpackets : l'activité en direct (flux d'événements) n'est pas retenue par Apache
    ProxyPass / http://127.0.0.1:8626/ timeout=600 flushpackets=on
    ProxyPassReverse / http://127.0.0.1:8626/
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 31457280
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"
    ErrorLog ${APACHE_LOG_DIR}/axiorhub-error.log
    CustomLog ${APACHE_LOG_DIR}/axiorhub-access.log combined
</VirtualHost>
