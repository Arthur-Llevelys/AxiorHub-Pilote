# OnlyOffice (serveur de documents) — hôte virtuel Apache (modèle : __DOMAIN__ remplacé par install-vps.sh ; HTTPS ajouté par certbot).
<VirtualHost *:80>
    ServerName __DOMAIN__
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /.well-known/acme-challenge !
    # Édition à plusieurs : connexions WebSocket
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:8082/$1 [P,L]
    ProxyPass / http://127.0.0.1:8082/ timeout=600
    ProxyPassReverse / http://127.0.0.1:8082/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "__DOMAIN__"
    LimitRequestBody 104857600
    ErrorLog ${APACHE_LOG_DIR}/office-error.log
    CustomLog ${APACHE_LOG_DIR}/office-access.log combined
</VirtualHost>
