# Nextcloud — hôte virtuel Apache (modèle : __DOMAIN__ remplacé par install-vps.sh ; HTTPS ajouté par certbot --apache).
<VirtualHost *:80>
    ServerName __DOMAIN__
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /.well-known/acme-challenge !
    # Découverte automatique des agendas et contacts (CalDAV / CardDAV)
    Redirect 301 /.well-known/carddav /remote.php/dav
    Redirect 301 /.well-known/caldav /remote.php/dav
    ProxyPass / http://127.0.0.1:8080/ timeout=3600
    ProxyPassReverse / http://127.0.0.1:8080/
    RequestHeader set X-Forwarded-Proto "https"
    # Envoi de gros fichiers (pièces, scans)
    LimitRequestBody 0
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    ErrorLog ${APACHE_LOG_DIR}/nextcloud-error.log
    CustomLog ${APACHE_LOG_DIR}/nextcloud-access.log combined
</VirtualHost>
