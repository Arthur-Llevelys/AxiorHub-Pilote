<VirtualHost *:80>
    ServerName agent.example.com
    Redirect permanent / https://agent.example.com/
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName agent.example.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/agent.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/agent.example.com/privkey.pem
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8626/ timeout=600
    ProxyPassReverse / http://127.0.0.1:8626/
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 26214400
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>
</IfModule>
