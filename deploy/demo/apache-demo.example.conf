# AxiorHub Pilote — démo en ligne (5.6.107, revu en 5.6.108) : hôte virtuel Apache d'exemple pour demo.example.test.
# Remplacez demo.example.test par votre sous-domaine. Modules : ssl, proxy, proxy_http, headers, alias
# (a2enmod ssl proxy proxy_http headers alias). Apache 2.4.7 ou plus récent (socket Unix dans ProxyPass). Rien d'autre n'est publié
# sur ce sous-domaine : ni server-status, ni phpMyAdmin, ni page d'administration.

# Journal minimal : ni adresse IP, ni chemin, ni navigateur ; seulement la date, le code de réponse et la taille.
LogFormat "%{%Y-%m-%dT%H:%M:%S}t %>s %B" axiorhub_demo_minimal

<VirtualHost *:80>
    ServerName demo.example.test
    CustomLog ${APACHE_LOG_DIR}/axiorhub-demo-acces.log axiorhub_demo_minimal
    Redirect permanent / https://demo.example.test/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName demo.example.test
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/demo.example.test/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/demo.example.test/privkey.pem

    # Journaux minimaux : l'accès sans adresse ni chemin ; les erreurs sans adresse du client (format sans champ d'adresse).
    CustomLog ${APACHE_LOG_DIR}/axiorhub-demo-acces.log axiorhub_demo_minimal
    ErrorLogFormat "[%{cu}t] [%-m:%l] %M"
    ErrorLog ${APACHE_LOG_DIR}/axiorhub-demo-erreurs.log
    LogLevel warn

    # Corps des requêtes : 10 Mo (corps_max_mo) plus l'en-tête du formulaire.
    LimitRequestBody 11534336
    ProxyRequests Off
    ProxyPreserveHost On
    # X-Forwarded-For : l'en-tête envoyé par le navigateur est effacé ; Apache ajoute ensuite la vraie adresse, que le répartiteur
    # n'utilise qu'en mémoire pour la limite de démarrages par adresse.
    RequestHeader unset X-Forwarded-For early
    RequestHeader set X-Forwarded-Proto "https"

    # Page de secours quand le service de la démo est arrêté ou en cours de mise à jour (Apache ne joint pas le socket : 502 ou 503).
    # Les réponses du répartiteur lui-même (« Démo complète », 503) restent affichées telles quelles (ProxyErrorOverride reste Off).
    # Variante Docker : remplacez /opt/axiorhub-demo/current par le dossier de l'archive.
    Alias /_secours/ /opt/axiorhub-demo/current/deploy/demo/secours/
    <Directory /opt/axiorhub-demo/current/deploy/demo/secours>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ProxyPass /_secours/ !
    ErrorDocument 502 /_secours/indisponible.html
    ErrorDocument 503 /_secours/indisponible.html

    # Socket installé par le service systemd ; pour la variante Docker : unix:/CHEMIN/DE/L/ARCHIVE/deploy/demo/socket/demo.sock
    ProxyPass / unix:/run/axiorhub-demo/demo.sock|http://demo.example.test/ timeout=660 flushpackets=on
    ProxyPassReverse / http://demo.example.test/

    # Interface de l'instance du visiteur (préfixe /agent-courriel). Indispensable si ce serveur héberge AUSSI une installation
    # d'AxiorHub en production : ses règles globales pour /agent-courriel (fichier de conf-enabled : ProxyPass, authentification)
    # s'appliquent à tous les hôtes virtuels et passent avant le « ProxyPass / » ci-dessus ; sans ce bloc, la demande du visiteur
    # arrive à l'AxiorHub de production (« Forbidden », « hote refuse », fenêtre de mot de passe). Le ProxyPass d'un bloc <Location>
    # passe avant ceux du serveur, et ce bloc remplace l'authentification héritée : la démo n'a ni mot de passe ni compte réel.
    # Sans AxiorHub de production sur ce serveur, ce bloc est sans effet (même destination que « ProxyPass / »).
    <Location /agent-courriel>
        # Même connexion (et mêmes réglages timeout=660, flushpackets=on) que « ProxyPass / » ci-dessus, défini avant ce bloc.
        ProxyPass unix:/run/axiorhub-demo/demo.sock|http://demo.example.test/agent-courriel
        ProxyPassReverse http://demo.example.test/agent-courriel
        AuthType None
        Require all granted
    </Location>

    # Le répartiteur envoie déjà « Referrer-Policy: same-origin » ; cette ligne l'impose aussi si une règle globale du serveur
    # (installation de production) posait « no-referrer » : Chrome enverrait alors « Origin: null » au bouton « Commencer la démo ».
    Header always set Referrer-Policy "same-origin"
    Header always unset X-Powered-By
</VirtualHost>
</IfModule>
