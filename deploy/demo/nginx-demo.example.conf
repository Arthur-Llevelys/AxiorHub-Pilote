# AxiorHub Pilote — démo en ligne (5.6.107) : serveur nginx d'exemple pour demo.example.test (à défaut d'Apache).
# Remplacez demo.example.test par votre sous-domaine ; nginx doit pouvoir joindre le socket (groupe axiorhub-demo, ou www-data
# pour la variante Docker).
log_format axiorhub_demo_minimal '$time_iso8601 $status $body_bytes_sent';   # ni adresse, ni chemin, ni navigateur

upstream axiorhub_demo {
    server unix:/run/axiorhub-demo/demo.sock;
}

server {
    listen 80;
    server_name demo.example.test;
    access_log /var/log/nginx/axiorhub-demo-acces.log axiorhub_demo_minimal;
    return 301 https://demo.example.test$request_uri;
}

server {
    listen 443 ssl;
    server_name demo.example.test;
    ssl_certificate /etc/letsencrypt/live/demo.example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.test/privkey.pem;
    access_log /var/log/nginx/axiorhub-demo-acces.log axiorhub_demo_minimal;
    server_tokens off;
    client_max_body_size 11m;

    location / {
        proxy_pass http://axiorhub_demo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;      # remplace toute valeur envoyée par le navigateur
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;                                # flux d'événements de l'interface
        proxy_read_timeout 660s;
    }
}
