# AxiorHub 5.6.70 — publication HTTPS de Jitsi Meet (installé par deploy/jitsi/installer-jitsi.sh, interface locale 127.0.0.1:10080).
# Modules : a2enmod proxy proxy_http proxy_wstunnel headers ssl ; certificat : certbot --apache -d visio.example.test
<VirtualHost *:80>
    ServerName visio.example.test
    Redirect permanent / https://visio.example.test/
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName visio.example.test
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/visio.example.test/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/visio.example.test/privkey.pem
    ProxyPreserveHost On
    ProxyRequests Off
    # Canaux temps réel (signalisation XMPP et pont vidéo) : avant la règle générale
    ProxyPass /xmpp-websocket ws://127.0.0.1:10080/xmpp-websocket
    ProxyPass /colibri-ws/ ws://127.0.0.1:10080/colibri-ws/
    ProxyPass / http://127.0.0.1:10080/
    ProxyPassReverse / http://127.0.0.1:10080/
    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
</IfModule>
